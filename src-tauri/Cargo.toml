[package]
name = "modbus-slave-studio"
version = "0.1.0"
description = "A simple Modbus TCP / RTU slave simulator"
authors = ["MyModbusClient contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "modbus_slave_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.2", features = [] }
tauri-plugin-dialog = "2.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "io-util", "sync", "time"] }
serialport = "4.10.1"
